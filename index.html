<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KML Viewer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f1419;
      color: #e8eef4;
    }
  </style>
  <link rel="stylesheet" href="/node_modules/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>KML Viewer</h1>
      <p class="subtitle" id="route-name">Loading route…</p>
    </div>
    <div class="actions">
      <label class="btn file-btn">
        Open KML
        <input type="file" id="kml-file" accept=".kml,application/vnd.google-earth.kml+xml,text/xml" />
      </label>
      <button type="button" class="btn secondary" id="btn-open-url" title="Load KML from a web address">
        Open URL
      </button>
      <button type="button" class="btn secondary" id="btn-sample" title="Load demo data">
        Demo data
      </button>
    </div>
  </header>

  <div
    class="modal"
    id="url-modal"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="url-modal-title"
  >
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel">
      <h2 id="url-modal-title">Open KML from URL</h2>
      <label class="modal-label" for="url-input">KML web address</label>
      <input
        type="url"
        id="url-input"
        class="modal-input"
        placeholder="https://example.com/route.kml"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="modal-hint">
        The host must allow CORS. If loading fails, download the file and use
        <strong>Open KML</strong>.
      </p>
      <p class="modal-error" id="url-error" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="btn-url-cancel">Cancel</button>
        <button type="button" class="btn" id="btn-url-load">Load</button>
      </div>
    </div>
  </div>

  <div
    class="modal"
    id="style-modal"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="style-modal-title"
  >
    <div class="modal-backdrop" data-close-style-modal></div>
    <div class="modal-panel modal-panel--style">
      <h2 id="style-modal-title">Map style</h2>
      <div class="style-sections">
        <fieldset class="style-section">
          <legend>Line</legend>
          <div class="style-controls">
            <label class="style-field" for="line-color">
              <span>Color</span>
              <input type="color" id="line-color" value="#5b9cff" />
            </label>
            <label class="style-field" for="line-width">
              <span>Width <em id="line-width-value">4 px</em></span>
              <input type="range" id="line-width" min="0.5" max="8" step="0.5" value="4" />
            </label>
            <label class="style-field" for="line-opacity">
              <span>Opacity <em id="line-opacity-value">90%</em></span>
              <input type="range" id="line-opacity" min="0.15" max="1" step="0.05" value="0.9" />
            </label>
          </div>
        </fieldset>
        <fieldset class="style-section">
          <legend>Points</legend>
          <div class="style-controls">
            <label class="style-field" for="point-color">
              <span>Color</span>
              <input type="color" id="point-color" value="#4de0b8" />
            </label>
            <label class="style-field" for="point-radius">
              <span>Radius <em id="point-radius-value">4 px</em></span>
              <input type="range" id="point-radius" min="1" max="12" step="1" value="4" />
            </label>
            <label class="style-field" for="point-opacity">
              <span>Opacity <em id="point-opacity-value">90%</em></span>
              <input type="range" id="point-opacity" min="0.15" max="1" step="0.05" value="0.9" />
            </label>
          </div>
        </fieldset>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="btn-style-done">Done</button>
      </div>
    </div>
  </div>

  <main class="layout">
    <section class="map-panel" aria-label="Map">
      <div id="map"></div>
      <button
        type="button"
        class="btn map-style-btn"
        id="btn-line-style"
        title="Adjust line and point style"
      >
        Map style
      </button>
    </section>

    <aside class="side-panel">
      <section class="card" aria-label="Route navigation">
        <div class="card-head">
          <h2>Point on route</h2>
          <span class="badge" id="point-badge">—</span>
        </div>
        <input type="range" id="route-slider" min="0" max="0" value="0" step="1" disabled />
        <div class="slider-meta">
          <span id="slider-label">0 / 0</span>
          <span id="distance-label">0 km</span>
        </div>
        <dl class="point-info" id="point-info">
          <div><dt>Latitude</dt><dd id="info-lat">—</dd></div>
          <div><dt>Longitude</dt><dd id="info-lon">—</dd></div>
          <div><dt>Elevation</dt><dd id="info-elev">—</dd></div>
          <div><dt>Distance</dt><dd id="info-dist">—</dd></div>
        </dl>
        <div class="address-row">
          <button type="button" class="btn" id="btn-address" disabled>
            Infer address
          </button>
          <p class="address-text" id="info-address" aria-live="polite">—</p>
        </div>
        <p class="status" id="status-msg" role="status"></p>
      </section>

      <section class="card chart-card" aria-label="Elevation profile">
        <div class="card-head">
          <h2>Elevation profile</h2>
          <span class="badge muted" id="elev-source">—</span>
        </div>
        <div class="chart-wrap">
          <canvas id="elev-chart"></canvas>
        </div>
      </section>
    </aside>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
