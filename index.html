<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KML Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>KML Viewer</h1>
      <p class="subtitle" id="route-name">Loading route…</p>
    </div>
    <div class="actions">
      <label class="btn file-btn">
        Open KML
        <input type="file" id="kml-file" accept=".kml,application/vnd.google-earth.kml+xml,text/xml" />
      </label>
      <button type="button" class="btn secondary" id="btn-sample" title="Load demo data">
        Demo data
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="map-panel" aria-label="Map">
      <div id="map"></div>
    </section>

    <aside class="side-panel">
      <section class="card" aria-label="Route navigation">
        <div class="card-head">
          <h2>Point on route</h2>
          <span class="badge" id="point-badge">—</span>
        </div>
        <input type="range" id="route-slider" min="0" max="0" value="0" step="1" disabled />
        <div class="slider-meta">
          <span id="slider-label">0 / 0</span>
          <span id="distance-label">0 km</span>
        </div>
        <dl class="point-info" id="point-info">
          <div><dt>Latitude</dt><dd id="info-lat">—</dd></div>
          <div><dt>Longitude</dt><dd id="info-lon">—</dd></div>
          <div><dt>Elevation</dt><dd id="info-elev">—</dd></div>
          <div><dt>Distance</dt><dd id="info-dist">—</dd></div>
        </dl>
        <div class="address-row">
          <button type="button" class="btn secondary" id="btn-address" disabled>
            Infer address
          </button>
          <p class="address-text" id="info-address" aria-live="polite">—</p>
        </div>
        <p class="status" id="status-msg" role="status"></p>
      </section>

      <section class="card chart-card" aria-label="Elevation profile">
        <div class="card-head">
          <h2>Elevation profile</h2>
          <span class="badge muted" id="elev-source">—</span>
        </div>
        <div class="chart-wrap">
          <canvas id="elev-chart"></canvas>
        </div>
      </section>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="./js/kml.js"></script>
  <script src="./js/elevation.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
